name: Publicar sitio (con Instagram)

on:
  push:
    branches: [main]
  schedule:
    # Cada 30 minutos: trae publicaciones e historias nuevas
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Recupera lo último que se bajó de Instagram (para no re-descargar todo
      # y para que el sitio no quede vacío si la API falla un rato)
      - name: Restaurar caché de Instagram
        uses: actions/cache/restore@v4
        with:
          path: .ig-cache
          key: ig-${{ github.run_id }}
          restore-keys: ig-

      - name: Sincronizar Instagram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          OUT_DIR: .ig-cache
          NEW_TOKEN_FILE: ${{ runner.temp }}/new_token
        run: node scripts/sync-instagram.mjs

      - name: Guardar token renovado
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NEW_TOKEN_FILE: ${{ runner.temp }}/new_token
        run: |
          if [ -s "$NEW_TOKEN_FILE" ]; then
            echo "::add-mask::$(cat "$NEW_TOKEN_FILE")"
            if [ -n "$GH_TOKEN" ]; then
              gh secret set IG_TOKEN --repo "$GITHUB_REPOSITORY" < "$NEW_TOKEN_FILE"
              echo "Secreto IG_TOKEN actualizado."
            else
              echo "::warning::Instagram devolvió un token nuevo pero no hay GH_PAT para guardarlo. Ver README."
            fi
          fi

      - name: Guardar caché de Instagram
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .ig-cache
          key: ig-${{ github.run_id }}

      - name: Armar sitio
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '.ig-cache' --exclude '_site' \
                --exclude 'scripts' --exclude 'README.md' ./ _site/
          cp -r .ig-cache/data .ig-cache/media _site/ 2>/dev/null || true
          ls -R _site | head -50

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # GitHub desactiva los workflows programados después de 60 días sin actividad
      # en el repo. Esto lo vuelve a habilitar una vez por día.
      - name: Mantener activo el cron
        if: github.event_name == 'schedule' && github.event.schedule == '*/30 * * * *'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H%M)" -lt "0030" ]; then
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/enable" || true
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
